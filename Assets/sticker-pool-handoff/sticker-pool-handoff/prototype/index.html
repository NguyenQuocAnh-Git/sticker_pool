<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Sticker Pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600&display=swap&subset=vietnamese">
<style>
/* Layout: one phone-width column — HUD, a craft-mat jar where stickers fall and stack under gravity, three washi-tape word choices underneath. */
:root{
  --desk:#1c252c; --desk-2:#27333c;
  --mat:#2c6552; --mat-line:rgba(236,232,196,.11); --mat-major:rgba(236,232,196,.26);
  --ink:#f2eee1; --muted:#9db0a8; --accent:#f2c14e; --danger:#ef8270;
  --tape-1:#f3a6b8; --tape-2:#95d5c0; --tape-3:#f4d77f; --tape-ink:#2a2320;
  --display:'Baloo 2', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  --body:'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
.app{max-width:500px;margin:0 auto;padding-inline:16px;padding-block:14px 28px;display:flex;flex-direction:column;gap:14px}

/* HUD */
.hud{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:6px;min-width:0}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.levels{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.levels .lab{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-right:2px}
.dot{width:19px;height:19px;border-radius:50%;border:2px solid var(--desk-2);background:var(--desk-2);color:var(--muted);font:600 10px/15px var(--body);text-align:center;padding:0;cursor:pointer}
.dot.done{background:var(--mat);border-color:var(--mat);color:var(--ink)}
.dot.cur{border-color:var(--accent);color:var(--ink)}
.dot:disabled{opacity:.45;cursor:default}
.counter{text-align:right;flex-shrink:0}
.counter .n{font-family:var(--display);font-weight:800;font-size:40px;line-height:.9;font-variant-numeric:tabular-nums}
.counter .n.low{color:var(--danger)}
.counter .l{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

.meta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 10px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px}
.btn{font:600 13px var(--body);color:var(--ink);background:var(--desk-2);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:7px 12px;cursor:pointer}
.btn:hover:not(:disabled){background:#32414c}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:#2a2112;border-color:transparent}
.btn.primary:hover{background:#f6cd68}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* Mat */
.stage{position:relative;width:100%;max-width:min(100%, calc(100dvh - 330px));min-width:260px;margin:0 auto}
.board{position:relative;aspect-ratio:1;border-radius:14px;container-type:inline-size;overflow:visible;
  background-color:var(--mat);
  background-image:
    linear-gradient(var(--mat-major) 1px,transparent 1px),
    linear-gradient(90deg,var(--mat-major) 1px,transparent 1px),
    linear-gradient(var(--mat-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--mat-line) 1px,transparent 1px);
  background-size:20% 20%,20% 20%,4% 4%,4% 4%;
  background-position:-1px -1px;
  box-shadow:0 18px 40px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06)}
.ruler{position:absolute;inset:0;pointer-events:none;font:600 9px var(--body);color:rgba(236,232,196,.45)}
.ruler i{position:absolute;font-style:normal}
.matlabel{position:absolute;right:8px;bottom:6px;font:600 9px var(--body);letter-spacing:.12em;color:rgba(236,232,196,.35);pointer-events:none}

.pit{position:absolute;inset:0;overflow:hidden;border-radius:14px}
.sticker{position:absolute;left:0;top:0;width:20%;aspect-ratio:1;display:grid;place-items:center;border:0;background:none;padding:0;cursor:pointer;will-change:transform;transform-origin:50% 50%}
.sticker .e{width:84%;height:84%;display:block;overflow:visible;pointer-events:none;
  filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.flyer{position:fixed;inset:0;pointer-events:none;z-index:500}
.flyer .sticker{position:fixed;aspect-ratio:1}

.dim{position:absolute;inset:0;border-radius:14px;background:rgba(12,18,22,.62);opacity:0;transition:opacity .3s;pointer-events:none}
.dim.on{opacity:1}
.count{position:fixed;transform:translate(-50%,0);min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--accent);color:#2a2112;
  font:800 15px/26px var(--display);text-align:center;box-shadow:0 3px 6px rgba(0,0,0,.35);animation:cpop .25s ease-out;font-variant-numeric:tabular-nums}
@keyframes cpop{0%{transform:translate(-50%,6px) scale(.4);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}
.rolltitle{position:fixed;transform:translate(-50%,0);font:800 30px/1.1 var(--display);color:var(--ink);white-space:nowrap;text-shadow:0 3px 0 rgba(0,0,0,.4);font-variant-numeric:tabular-nums}
.rolltitle.done{color:var(--accent);animation:tpop .35s ease-out}
@keyframes tpop{50%{transform:translate(-50%,0) scale(1.15)}}
.pop{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font:800 44px var(--display);color:var(--accent);
  text-shadow:0 3px 0 rgba(0,0,0,.35);pointer-events:none;animation:pop 1s ease-out forwards;z-index:300;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}

/* Info line */
.info{min-height:22px;text-align:center;font-size:14px;color:var(--muted);line-height:1.45;max-width:46ch;margin:0 auto;text-wrap:balance}
.info b{color:var(--ink)}

/* Washi tapes */
.tapes{display:flex;gap:10px;justify-content:center}
.tape{flex:1 1 0;min-width:0;max-width:160px;border:0;background:none;padding:0;cursor:pointer;transform:rotate(var(--r));
  filter:drop-shadow(0 4px 5px rgba(0,0,0,.35));transition:transform .15s}
.tape:hover:not(:disabled){transform:rotate(var(--r)) translateY(-3px)}
.tape:disabled{cursor:default}
.tape .s{display:flex;flex-direction:column;align-items:center;gap:0;padding:9px 12px 8px;color:var(--tape-ink);
  background-color:var(--c);
  background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.32) 0 5px,transparent 5px 11px);
  clip-path:polygon(0 0,100% 0,96% 12%,100% 25%,96% 37%,100% 50%,96% 62%,100% 75%,96% 87%,100% 100%,0 100%,4% 87%,0 75%,4% 62%,0 50%,4% 37%,0 25%,4% 12%)}
.tape .c{font:600 10px var(--body);letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.tape .w{font:800 21px/1.15 var(--display);overflow-wrap:anywhere}
.tape.picked{animation:picked .5s}
@keyframes picked{40%{transform:rotate(0deg) scale(1.1)}}
.tapes.wait .tape:not(.picked){opacity:.45}

/* Overlay */
.over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(18,24,29,.72);border-radius:14px;z-index:400;padding:16px}
.card{background:var(--desk-2);border-radius:16px;padding:22px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:300px;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.card h2{margin:0;font:800 30px/1.05 var(--display)}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.stars{font-size:30px;letter-spacing:4px;color:var(--accent)}
.stars .off{color:#4a5862}
.card .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}

@media (prefers-reduced-motion:reduce){
  .sticker.fly{animation-duration:.25s}
  .sticker.nope,.tape.picked{animation:none}
  .pop{animation-duration:.6s}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <pattern id="p-wood" patternUnits="userSpaceOnUse" width="64" height="8"><path d="M-4 4q8-2.6 16 0t16 0t16 0t16 0t16 0" fill="none" stroke="#2a1608" stroke-opacity=".42" stroke-width="1.5"/></pattern>

  <linearGradient id="g-glass" x1="0" y1="0" x2="1" y2=".35"><stop offset=".26" stop-color="#fff" stop-opacity="0"/><stop offset=".3" stop-color="#fff" stop-opacity=".9"/><stop offset=".38" stop-color="#fff" stop-opacity=".9"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/><stop offset=".47" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset=".53" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="g-rubber" cx=".36" cy=".3" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset=".14" stop-color="#fff" stop-opacity=".35"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#000" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
</defs></svg>
<div class="app">
  <div class="hud">
    <div class="brand">
      <h1>Sticker <span>Pool</span></h1>
      <div class="levels" id="levels"><span class="lab">Màn</span></div>
    </div>
    <div class="counter"><div class="n" id="moves">0</div><div class="l">lượt còn</div></div>
  </div>

  <div class="meta">
    <span>Còn <b id="left">0</b> sticker trong hũ</span>
    <div class="tools">
      <button class="btn" id="sound" type="button" aria-pressed="true">Tiếng: Bật</button>
      <button class="btn" id="reroll" type="button">Đổi từ (1)</button>
      <button class="btn" id="restart" type="button">Chơi lại</button>
    </div>
  </div>

  <div class="stage">
    <div class="board" id="board"></div>
  </div>

  <div class="info" id="info"></div>
  <div class="tapes" id="tapes"></div>
</div>

/* ---------- Core logic (no DOM) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rnd){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function hashIds(alive){let h=2166136261;for(const id of [...alive].sort((a,b)=>a-b)){h^=id+1;h=Math.imul(h,16777619)}return h>>>0}

/* The sticker set is fixed per level (L.seed); each play (run) reshuffles order, spawn spot, angle and word offers. */
function genLevel(L,run){
  const rnd=mulberry32(L.seed),r2=mulberry32(run>>>0);
  const focusCount=c=>L.focus?ITEMS.filter(it=>it.color===c&&it.tags.includes(L.focus)).length:0;
  const cols=shuffle(TAGS.mau.slice(),rnd).sort((a,b)=>focusCount(b)-focusCount(a)).slice(0,L.k);
  const score=it=>(L.focus&&it.tags.includes(L.focus)?4:0)+it.tags.filter(t=>t!==it.color&&L.tags.includes(t)).length+rnd()*.9;
  const pool=ITEMS.filter(it=>cols.includes(it.color)).map(it=>[score(it),it]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
  const picked=shuffle(Array.from({length:L.n},(_,i)=>pool[i%pool.length]),r2);
  return picked.map((item,i)=>({id:i,item,x:r2(),rot:(r2()-.5)*2.4}));
}
const hitsFor=(stk,alive,tag)=>[...alive].filter(id=>stk[id].item.tags.includes(tag));
/* Offer 3 words: always one big sweep, the focus word when it is on the table, the rest random. */
function makeOffers(L,stk,alive,reroll,run){
  const rnd=mulberry32((L.seed*7919+hashIds(alive)+reroll*104729+(run>>>0)*2654435761)>>>0);
  const cand=L.tags.map(t=>[t,hitsFor(stk,alive,t).length]).filter(x=>x[1]>0);
  const good=cand.filter(x=>x[1]>=2);const list=shuffle((good.length>=3?good:cand).slice(),rnd);
  const out=[];
  const best=list.slice().sort((a,b)=>b[1]-a[1]);const top=best.filter(x=>x[1]>=best[0][1]-1);
  if(top.length)out.push(top[Math.floor(rnd()*top.length)][0]);
  if(L.focus&&list.some(x=>x[0]===L.focus&&x[1]>=2)&&!out.includes(L.focus))out.push(L.focus);
  for(const [t] of list){if(out.length>=3)break;if(!out.includes(t))out.push(t)}

}
function greedyMoves(L,stk,run){
  const alive=new Set(stk.map(s=>s.id));let moves=0;
  while(alive.size&&moves<200){
    let best=null;
    for(const t of makeOffers(L,stk,alive,0,run)){const h=hitsFor(stk,alive,t);if(!best||h.length>best.length)best=h}
    best.forEach(i=>alive.delete(i));moves++;
  }
  return moves;
}

/* Tiny Verlet circle physics: gravity, circle-circle collisions, jar walls, rolling spin. */
function makeWorld(W,H){
  const bodies=[];const G=0.18,SUB=2,IT=5,VMAX=28;
  function add(x,y,r,a){const b={x,y,px:x,py:y,r,a:a||0};bodies.push(b);return b}
  function remove(b){const i=bodies.indexOf(b);if(i>=0)bodies.splice(i,1)}
  function clear(){bodies.length=0}
  function kick(b,vx,vy){b.px=b.x-vx;b.py=b.y-vy}
  function substep(){
    for(const b of bodies){
      let vx=(b.x-b.px)*.995,vy=(b.y-b.py)*.995;
      const sp=Math.hypot(vx,vy);if(sp>VMAX){vx*=VMAX/sp;vy*=VMAX/sp}
      b.px=b.x;b.py=b.y;b.x+=vx;b.y+=vy+G;
    }
    for(let k=0;k<IT;k++){
      for(let i=0;i<bodies.length;i++){const a=bodies[i];
        for(let j=i+1;j<bodies.length;j++){const c=bodies[j];
          const dx=c.x-a.x,dy=c.y-a.y,min=a.r+c.r,d2=dx*dx+dy*dy;
          if(d2<min*min&&d2>1e-6){const d=Math.sqrt(d2),o=(min-d)/2/d;
            a.x-=dx*o;a.y-=dy*o;c.x+=dx*o;c.y+=dy*o}}}
      for(const b of bodies){
        if(b.y>H-b.r){b.y=H-b.r;b.px+=(b.x-b.px)*.08}
        if(b.x<b.r){b.x=b.r}
        if(b.x>W-b.r){b.x=W-b.r}
      }
    }
    for(const b of bodies)b.a+=(b.x-b.px)/b.r;
  }
  function step(){for(let i=0;i<SUB;i++)substep()}
  return {bodies,add,remove,clear,kick,step};
}

    cloth:(t,k)=>{noise(t,.18,{gain:.45,type:'lowpass',f:1100*k,f2:280,q:.6});noise(t+.05,.1,{gain:.15,type:'lowpass',f:700*k,q:.6})},
    rubber:(t,k)=>{tone(t,240*k,.2,{gain:.32,f2:520*k,type:'triangle'});tone(t+.1,520*k,.12,{gain:.18,f2:360*k,type:'triangle'})},
    animal:(t,k)=>{tone(t,520*k,.11,{gain:.25,f2:1150*k});tone(t+.07,760*k,.1,{gain:.18,f2:1350*k})},
    food:(t,k)=>{for(let j=0;j<3;j++)noise(t+j*.04,.045,{gain:.32,f:2300*k,q:1.4})},
    vehicle:(t,k)=>{tone(t,440*k,.15,{type:'square',gain:.07});tone(t,554*k,.15,{type:'square',gain:.05})},
    toy:(t,k)=>{tone(t,880*k,.13,{gain:.18,f2:1400*k,type:'triangle'});tone(t+.06,1400*k,.08,{gain:.12,f2:900*k,type:'triangle'})},
    music:(t,k)=>{tone(t,330*k,.7,{type:'triangle',gain:.26,attack:.002});tone(t,660*k,.35,{gain:.08})},
    fly:(t,k)=>{noise(t,.26,{gain:.3,f:450*k,f2:2800*k,q:2.5})},
    water:(t,k)=>{tone(t,280*k,.09,{gain:.32,f2:1000*k});tone(t+.05,420*k,.07,{gain:.18,f2:1300*k})},
    sky:(t,k)=>{[1,1.5,2].forEach((r,j)=>tone(t+j*.045,1400*k*r,.32,{gain:.07}))},
    leaf:(t,k)=>{noise(t,.07,{gain:.3,f:3200*k,q:1.2});noise(t+.06,.06,{gain:.22,f:4200*k,q:1.2})},
    loud:(t,k)=>{[1,1.26,1.5].forEach(r=>tone(t,330*k*r,.22,{type:'sawtooth',gain:.05,attack:.003}));tone(t,165*k,.22,{type:'square',gain:.05})},
    color:(t,k)=>{tone(t,523*k,.4,{gain:.26,attack:.002});tone(t,523*k*4,.1,{gain:.05})}
  };
  const TAG_KIT={'Thủy tinh':'glass','Kim loại':'metal','Gỗ':'wood','Vải':'cloth','Cao su':'rubber',
    'Đồ ăn':'food','Con vật':'animal','Đồ chơi':'toy','Quần áo':'cloth','Xe cộ':'vehicle','Đồ dùng':'wood',
    'Nhà bếp':'metal','Biển':'water','Bầu trời':'sky','Khu vườn':'leaf','Biết bay':'fly','Kêu to':'loud'};
  const PENTA=[0,2,4,7,9,12,14,16,19];
  const step=i=>Math.pow(2,PENTA[Math.min(i,PENTA.length-1)]/12);
  return {
    get on(){return on},
    toggle(){on=!on;try{localStorage.setItem('stickerpool.sound',on?'1':'0')}catch(e){}if(on)ac();return on},
    unlock(){if(on)ac()},
    tag(name,i){if(!on||!ac())return;(KIT[TAG_KIT[name]]||KIT.color)(ctx.currentTime,step(i))},
    pop(){if(!on||!ac())return;const t=ctx.currentTime,r=.85+Math.random()*.3;
      tone(t,950*r,.06,{gain:.38,f2:170,attack:.001});noise(t,.012,{gain:.14,type:'highpass',f:3200})},
    win(){if(!on||!ac())return;const t=ctx.currentTime;[523,659,784,1047].forEach((f,j)=>{tone(t+j*.11,f,.45,{gain:.22,attack:.002});tone(t+j*.11,f*4,.12,{gain:.04})})}
  };
})();

/* ---------- UI ---------- */
function boot(){
const $=id=>document.getElementById(id);
const board=$('board'),tapesEl=$('tapes'),info=$('info');
const TAPE_COLORS=['var(--tape-1)','var(--tape-2)','var(--tape-3)'];
const TAPE_ROT=[-3,2,-1.5];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* Playtest build: every level is open. */
let unlocked=LEVELS.length;const cleared=new Set();
let G=null,busy=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* World is 500 x 500 units, matching the square jar. */
const W=500,H=500,D=100;
const radiusOf=it=>it.sr*D*.84/64+2;
const world=makeWorld(W,H);
const flyer=document.createElement('div');flyer.className='flyer';document.body.appendChild(flyer);
let pit=null;

function start(idx){
  const L=LEVELS[idx];
  /* Same move budget every attempt: reshuffle until this layout's greedy solution fits it. */
  let run,stk;
  for(let t=0;t<80;t++){run=(Math.random()*4294967296)>>>0;stk=genLevel(L,run);if(greedyMoves(L,stk,run)<=budgetOf(L))break}
  world.clear();
  G={idx,L,stk,run,alive:new Set(stk.map(s=>s.id)),used:0,budget:budgetOf(L)+L.slack,reroll:0,rerollLeft:1,els:{},bodies:{}};
  board.innerHTML='';
  const ruler=document.createElement('div');ruler.className='ruler';
  for(let i=1;i<5;i++)ruler.insertAdjacentHTML('beforeend',`<i style="left:calc(${i*20}% + 3px);top:3px">${i*5}</i>`);
  for(let i=1;i<5;i++)ruler.insertAdjacentHTML('beforeend',`<i style="left:4px;top:calc(${i*20}% + 2px)">${i*5}</i>`);
  board.appendChild(ruler);
  board.insertAdjacentHTML('beforeend','<div class="matlabel">CUTTING MAT · cm</div>');
  pit=document.createElement('div');pit.className='pit';board.appendChild(pit);
  stk.forEach((s,i)=>{
    const b=document.createElement('button');b.type='button';b.className='sticker';
    b.setAttribute('aria-label',s.item.name);b.innerHTML=svgFor(s.item);
    b.addEventListener('click',()=>tapSticker(s.id));
    pit.appendChild(b);G.els[s.id]=b;
    const row=Math.floor(i/9)*2+(i%9>=5?1:0),col=i%9>=5?i%9-5:i%9,odd=row%2;
    const x=(odd?100:50)+col*100+(s.x-.5)*16,y=-45-row*80-(s.x*13);
    b.style.transformOrigin=`${s.item.fx*100}% ${s.item.fy*100}%`;
    G.bodies[s.id]=world.add(x,y,radiusOf(s.item),s.rot);
  });
  info.innerHTML=L.hint;
  renderLevels();refresh();draw();
}

function draw(){
  if(!G||!pit)return;
  const s=pit.clientWidth/W;
  for(const id of G.alive){const b=G.bodies[id],el=G.els[id];if(!b||!el)continue;const it=G.stk[id].item;
    el.style.transform=`translate(${((b.x-it.fx*D)*s).toFixed(1)}px,${((b.y-it.fy*D)*s).toFixed(1)}px) rotate(${b.a.toFixed(3)}rad)`}
}
let last=performance.now(),acc=0;
function loop(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){world.step();acc-=1000/60}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function renderLevels(){
  const box=$('levels');box.querySelectorAll('.dot').forEach(d=>d.remove());
  LEVELS.forEach((_,i)=>{const d=document.createElement('button');d.type='button';d.className='dot';d.textContent=i+1;
    if(cleared.has(i))d.classList.add('done');
    if(i===G.idx)d.classList.add('cur');
    d.disabled=i>=unlocked;d.setAttribute('aria-label','Màn '+(i+1));
    d.addEventListener('click',()=>{if(!busy)start(i)});box.appendChild(d)});
}
function refresh(){
  const left=G.budget-G.used;$('moves').textContent=left;$('moves').classList.toggle('low',left<=1);
  $('left').textContent=G.alive.size;
  $('reroll').textContent=`Đổi từ (${G.rerollLeft})`;$('reroll').disabled=G.rerollLeft<1||busy;
  tapesEl.classList.remove('wait');tapesEl.innerHTML='';
  if(!G.alive.size||left<=0)return;
  makeOffers(G.L,G.stk,G.alive,G.reroll,G.run).forEach((t,i)=>{
    const b=document.createElement('button');b.type='button';b.className='tape';
    b.style.setProperty('--c',TAPE_COLORS[i]);b.style.setProperty('--r',TAPE_ROT[i]+'deg');
    b.innerHTML=`<span class="s"><span class="c">${CAT_NAME[CAT_OF[t]]}</span><span class="w">${t}</span></span>`;
    b.addEventListener('click',()=>choose(t,b));tapesEl.appendChild(b);
  });
}
function tapSticker(id){
  const s=G.stk[id],b=G.bodies[id];if(!b||!G.alive.has(id))return;
  info.innerHTML=`<b>${s.item.name}</b>`;
  world.kick(b,(Math.random()-.5)*5,-9);
}
async function choose(tag,tapeEl){
  if(busy)return;busy=true;
  const hit=hitsFor(G.stk,G.alive,tag);const n=hit.length;
  G.used++;G.reroll=0;
  tapeEl.classList.add('picked');tapesEl.classList.add('wait');
  [...tapesEl.querySelectorAll('button')].forEach(b=>b.disabled=true);$('reroll').disabled=true;
  $('moves').textContent=G.budget-G.used;
  const T=reduce?.35:1;const DUR=470*T,ST=75*T;

  /* Lift every match into a centered line and count them as they arrive. */
  const br=board.getBoundingClientRect();
  const rows=Math.ceil(n/6),cols=Math.ceil(n/rows);
  const pr=pit.getBoundingClientRect(),sc=pit.clientWidth/W,w0=D*sc;
  const S=Math.min(w0*1.3,(br.width-24)/cols-10);
  const gapY=S+30;
  const top0=br.top+br.height*.5-(rows-1)*gapY/2;
  const dim=document.createElement('div');dim.className='dim';board.appendChild(dim);
  requestAnimationFrame(()=>dim.classList.add('on'));
  const title=document.createElement('div');title.className='rolltitle';title.textContent=tag;
  title.style.left=(br.left+br.width/2)+'px';title.style.top=(top0-S/2-46)+'px';flyer.appendChild(title);
  const parts=hit.map((id,i)=>{
    const el=G.els[id],b=G.bodies[id];G.alive.delete(id);
    const it=G.stk[id].item,a=b.a;
    const cx=pr.left+b.x*sc,cy=pr.top+b.y*sc;
    world.remove(b);delete G.bodies[id];
    el.style.width=w0+'px';el.style.left=(cx-it.fx*w0)+'px';el.style.top=(cy-it.fy*w0)+'px';
    el.style.transform=`rotate(${a}rad)`;flyer.appendChild(el);
    const row=Math.floor(i/cols),inRow=Math.min(cols,n-row*cols),col=i-row*cols;
    const sx=br.left+br.width/2+(col-(inRow-1)/2)*(S+10),sy=top0+row*gapY;
    const k=S/w0;
    const end=`translate(${sx-cx}px,${sy-cy}px) rotate(0rad) scale(${k})`;
    el.animate([
      {transform:`translate(0,0) rotate(${a}rad) scale(1)`},
      {transform:`translate(${(sx-cx)*.45}px,${(sy-cy)*.45-40}px) rotate(${a*.4}rad) scale(${k*1.12})`,offset:.55},
      {transform:end}
    ],{duration:DUR,delay:i*ST,easing:'cubic-bezier(.3,.7,.3,1)',fill:'forwards'});
    return {el,cx,cy,sx,sy,k,end};
  });
  /* Each sticker gets its number the moment it lands in the line. */
  const badges=[];let counted=0;
  parts.forEach((p,i)=>setTimeout(()=>{
    const c=document.createElement('div');c.className='count';c.textContent=i+1;
    c.style.left=p.sx+'px';c.style.top=(p.sy+S/2+4)+'px';flyer.appendChild(c);badges.push(c);
    p.el.animate([{transform:p.end},{transform:p.end+' scale(1.18)'},{transform:p.end}],{duration:200*T,easing:'ease-out'});
    SFX.tag(tag,i);counted++;title.textContent=`${tag} · ${counted}`;
  },i*ST+DUR*.9));
  await sleep((n-1)*ST+DUR+60);

  title.textContent=`${tag} · ${n}${n>=6?' Quá đỉnh!':n>=4?' Tuyệt!':''}`;
  title.classList.add('done');
  info.innerHTML=`<b>${tag}</b>: bay ${n} sticker.`;
  await sleep(480*T);

  /* Then everyone flies into the chosen tape. */
  const tr=tapeEl.getBoundingClientRect();const tx=tr.left+tr.width/2,ty=tr.top+tr.height/2;
  dim.classList.remove('on');
  badges.forEach(c=>c.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'}));
  title.animate([{opacity:1},{opacity:0}],{duration:250,fill:'forwards'});
  parts.forEach((p,i)=>{
    p.el.animate([
      {transform:p.end,opacity:1},
      {transform:`translate(${tx-p.cx}px,${ty-p.cy}px) rotate(.8rad) scale(${p.k*.3})`,opacity:.2}
    ],{duration:480*T,delay:i*45*T,easing:'cubic-bezier(.55,0,.75,.4)',fill:'forwards'});
    setTimeout(()=>SFX.pop(),i*45*T+470*T);
  });
  await sleep((480+n*45)*T+60);
  tapeEl.animate([{transform:`rotate(${tapeEl.style.getPropertyValue('--r')}) scale(1)`},{transform:`rotate(0deg) scale(1.12)`},{transform:`rotate(${tapeEl.style.getPropertyValue('--r')}) scale(1)`}],{duration:260});
  parts.forEach(p=>p.el.remove());badges.forEach(c=>c.remove());title.remove();dim.remove();
  await sleep(200);
  busy=false;refresh();
  if(!G.alive.size)return win();
  if(G.used>=G.budget)return lose();
}
function overlay(html){const o=document.createElement('div');o.className='over';o.innerHTML=`<div class="card">${html}</div>`;board.appendChild(o);return o}
function win(){
  SFX.win();
  const left=G.budget-G.used;const stars=left>=2?3:left===1?2:1;
  cleared.add(G.idx);
  renderLevels();
  const lastLv=G.idx===LEVELS.length-1;
  const o=overlay(`<div class="stars">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3-stars)}</span></div>
    <h2>${lastLv?'Sạch hết các hũ!':'Sạch hũ!'}</h2>
    <p>Dùng ${G.used}/${G.budget} lượt.${left>0?` Dư ${left} lượt.`:''}</p>
    <div class="row">${lastLv?'':'<button class="btn primary" id="next" type="button">Màn tiếp</button>'}<button class="btn" id="again" type="button">Chơi lại</button></div>`);
  o.querySelector('#again').onclick=()=>start(G.idx);
  const nx=o.querySelector('#next');if(nx){nx.onclick=()=>start(G.idx+1);nx.focus()}
}
function lose(){
  const o=overlay(`<h2>Hết lượt</h2><p>Còn ${G.alive.size} sticker trong hũ. Thử chọn từ quét được nhiều sticker hơn mỗi lượt.</p>
    <div class="row"><button class="btn primary" id="again" type="button">Thử lại</button></div>`);
  const b=o.querySelector('#again');b.onclick=()=>start(G.idx);b.focus();
}
const sb=$('sound');
function soundLabel(){sb.textContent='Tiếng: '+(SFX.on?'Bật':'Tắt');sb.setAttribute('aria-pressed',String(SFX.on))}
soundLabel();sb.onclick=()=>{SFX.toggle();soundLabel()};
addEventListener('pointerdown',()=>SFX.unlock(),{once:true});
$('restart').onclick=()=>{if(!busy)start(G.idx)};
$('reroll').onclick=()=>{if(busy||G.rerollLeft<1)return;G.rerollLeft--;G.reroll++;refresh();info.textContent='Đã đổi bộ từ.'};
addEventListener('resize',draw);
start(0);
}
if(typeof document!=='undefined')boot();
else if(typeof module!=='undefined')module.exports={LEVELS,genLevel,greedyMoves,makeOffers};
</script>
</body></html>
